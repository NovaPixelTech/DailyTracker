openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Calorie Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: User profile operations
  - name: entries
    description: Daily calorie entries
  - name: stats
    description: Statistics and analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertProfile
      tags: [profile]
      summary: Create or update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List daily calorie entries
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Create a daily entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryBody"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"

  /entries/today:
    get:
      operationId: getTodayEntry
      tags: [entries]
      summary: Get today's entry
      responses:
        "200":
          description: Today's entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: No entry for today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/{date}:
    get:
      operationId: getEntryByDate
      tags: [entries]
      summary: Get entry by date (YYYY-MM-DD)
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entry for date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertEntryByDate
      tags: [entries]
      summary: Create or update entry by date
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryBody"
      responses:
        "200":
          description: Upserted entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete an entry by date
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get overall stats summary (weekly avg, monthly avg, estimated weight change)
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/weekly:
    get:
      operationId: getWeeklyStats
      tags: [stats]
      summary: Get weekly calorie stats (last 7 days)
      responses:
        "200":
          description: Weekly stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyStatItem"

  /stats/monthly:
    get:
      operationId: getMonthlyStats
      tags: [stats]
      summary: Get monthly calorie stats (last 30 days)
      responses:
        "200":
          description: Monthly stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyStatItem"

  /stats/weight-trend:
    get:
      operationId: getWeightTrend
      tags: [stats]
      summary: Get estimated weight trend over last 30 days
      responses:
        "200":
          description: Weight trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightTrendItem"

  /stats/today-recommendation:
    get:
      operationId: getTodayRecommendation
      tags: [stats]
      summary: Get today's calorie recommendation based on profile and goal
      responses:
        "200":
          description: Today's recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayRecommendation"
        "404":
          description: No profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Profile:
      type: object
      properties:
        id:
          type: integer
        weightKg:
          type: number
        heightCm:
          type: number
        age:
          type: integer
        gender:
          type: string
        activityLevel:
          type: string
        goal:
          type: string
        targetCalorieDelta:
          type: integer
        tdee:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - weightKg
        - heightCm
        - age
        - gender
        - activityLevel
        - goal
        - targetCalorieDelta
        - tdee
        - createdAt
        - updatedAt

    UpsertProfileBody:
      type: object
      properties:
        weightKg:
          type: number
        heightCm:
          type: number
        age:
          type: integer
        gender:
          type: string
        activityLevel:
          type: string
        goal:
          type: string
        targetCalorieDelta:
          type: integer
      required:
        - weightKg
        - heightCm
        - age
        - gender
        - activityLevel
        - goal
        - targetCalorieDelta

    Entry:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
        breakfastKcal:
          type: integer
        lunchKcal:
          type: integer
        dinnerKcal:
          type: integer
        snacksKcal:
          type: integer
        walkingKcal:
          type: integer
        workoutKcal:
          type: integer
        otherBurnedKcal:
          type: integer
        notes:
          type: ["string", "null"]
        totalIntake:
          type: integer
        totalBurned:
          type: integer
        netCalories:
          type: integer
        status:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - date
        - breakfastKcal
        - lunchKcal
        - dinnerKcal
        - snacksKcal
        - walkingKcal
        - workoutKcal
        - otherBurnedKcal
        - notes
        - totalIntake
        - totalBurned
        - netCalories
        - status
        - createdAt
        - updatedAt

    CreateEntryBody:
      type: object
      properties:
        date:
          type: string
        breakfastKcal:
          type: integer
        lunchKcal:
          type: integer
        dinnerKcal:
          type: integer
        snacksKcal:
          type: integer
        walkingKcal:
          type: integer
        workoutKcal:
          type: integer
        otherBurnedKcal:
          type: integer
        notes:
          type: ["string", "null"]
      required:
        - date
        - breakfastKcal
        - lunchKcal
        - dinnerKcal
        - snacksKcal
        - walkingKcal
        - workoutKcal
        - otherBurnedKcal

    StatsSummary:
      type: object
      properties:
        weeklyAvgIntake:
          type: number
        weeklyAvgBurned:
          type: number
        weeklyAvgNet:
          type: number
        monthlyAvgIntake:
          type: number
        monthlyAvgBurned:
          type: number
        monthlyAvgNet:
          type: number
        estimatedWeeklyWeightChangeKg:
          type: number
        totalEntriesCount:
          type: integer
        currentStreak:
          type: integer
      required:
        - weeklyAvgIntake
        - weeklyAvgBurned
        - weeklyAvgNet
        - monthlyAvgIntake
        - monthlyAvgBurned
        - monthlyAvgNet
        - estimatedWeeklyWeightChangeKg
        - totalEntriesCount
        - currentStreak

    DailyStatItem:
      type: object
      properties:
        date:
          type: string
        totalIntake:
          type: integer
        totalBurned:
          type: integer
        netCalories:
          type: integer
        status:
          type: string
      required:
        - date
        - totalIntake
        - totalBurned
        - netCalories
        - status

    WeightTrendItem:
      type: object
      properties:
        date:
          type: string
        estimatedWeightKg:
          type: number
        cumulativeDeficit:
          type: number
      required:
        - date
        - estimatedWeightKg
        - cumulativeDeficit

    TodayRecommendation:
      type: object
      properties:
        tdee:
          type: integer
        targetCalories:
          type: integer
        currentIntake:
          type: integer
        currentBurned:
          type: integer
        remainingCalories:
          type: integer
        message:
          type: string
        status:
          type: string
        goal:
          type: string
        netCalories:
          type: integer
      required:
        - tdee
        - targetCalories
        - currentIntake
        - currentBurned
        - remainingCalories
        - message
        - status
        - goal
        - netCalories
